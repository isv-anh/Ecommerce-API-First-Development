

services:
  hrm-api:
    container_name: hrm-api
    build:
      context: docker/hrm-api/dev
      dockerfile: dev.dockerfile
      args:
        - UID=${UID}
        - GID=${GID}
    ports:
      - "8080:8080"
    volumes:
      - ./packages/hrm-api:/app/packages/hrm-api
      - m2_data:/home/pengu/.m2
    environment:
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=postgres-db
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
    depends_on:
      - postgres-db
    networks:
      - hrm-network

  hrm-front:
    container_name: hrm-front
    build: 
      context: docker/hrm-front/dev
      dockerfile: dev.dockerfile
      args:
        - UID=${UID}
        - GID=${GID}
    ports:
      - "3000:3000"
    volumes:
      - ./packages/hrm-front:/app/packageshrm-front
    networks:
      - hrm-network
  
  postgres-db:
    container_name: postgres-db
    image: postgres
    ports:
      - "5432:5432"
    restart: always
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - hrm-network
  
  seft-runner:
    container_name: seft-runner
    build: 
      context: docker/seft-hosted-runner
      dockerfile: dockerfile
      args:
        - RUNNER_TOKEN=${RUNNER_TOKEN}
        - RUNNER_NAME=${RUNNER_NAME}
    environment:
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=postgres-db
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
    # volumes:
    #   - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - postgres-db
    networks:
      - hrm-network

networks:
  hrm-network:
    driver: bridge
volumes:
  pg_data:
  # maven dependency cache
  m2_data:

# docker compose down containername -v -- down and remove volumes
# docker compose up -d -- build -- build and run in detached mode
# docker compose logs -f -- follow logs
# docker compose exec hrm-api bash -- enter the hrm-api container
# docker compose exec postgres-db bash -- enter the postgres-db container
