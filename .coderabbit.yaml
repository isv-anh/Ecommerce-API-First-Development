language: vi
early_access: false

reviews:
  auto_review:
    enabled: true
    base_branches:
      - "develop"

  review_status: false

  high_level_summary: true
  changed_files_summary: true

  path_instructions:
    - path: "**/*"
      instructions: |
        Hãy review pull request này với vai trò là một Senior Fullstack Engineer.

        Repository là một monorepo bao gồm:
        - Frontend Next.js sử dụng TanStack Query và Material UI
        - Backend NestJS
        - OpenAPI / TypeSpec cho API contracts
        - Liquibase cho database migrations

        Tập trung vào:
        - lỗi (bugs)
        - vấn đề bảo mật (security issues)
        - vấn đề hiệu năng (performance problems)
        - quyết định kiến trúc không phù hợp (bad architecture decisions)
        - vấn đề về khả năng bảo trì (maintainability problems)

        Bỏ qua các vấn đề về định dạng mã nguồn (formatting issues).
