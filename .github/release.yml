changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot
  categories:
    - title: 🚀 Features
      labels:
        - feature
        - enhancement
    - title: 🐛 Bug Fixes
      labels:
        - bug
        - fix
    - title: 📝 Documentation
      labels:
        - documentation
        - docs
    - title: 🔨 Maintenance & Refactor
      labels:
        - chore
        - refactor
        - maintenance
    - title: 📦 Dependencies
      labels:
        - dependencies
    - title: 🛡️ Security
      labels:
        - security
    - title: ⚙️ Other Changes
      labels:
        - "*"
