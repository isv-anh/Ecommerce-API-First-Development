name: "[CI] AI Assistant Build and Test"

on:
  pull_request:
    types: [assigned]
    paths:
      - "packages/ai-assistant/**"
      - ".github/workflows/ci-ai-assistant.yml"

jobs:
  resolve-runner:
    runs-on: ubuntu-24.04
    outputs:
      runner: ${{ steps.set.outputs.runner }}
    steps:
      - name: Set runner
        id: set
        run: |
          if echo '${{ toJSON(github.event.pull_request.labels.*.name) }}' | grep -q 'self-hosted'; then
            echo 'runner=["self-hosted", "${{ github.event.sender.login }}"]' >> $GITHUB_OUTPUT
          else
            echo 'runner=["ubuntu-24.04"]' >> $GITHUB_OUTPUT
          fi

  ci-check:
    needs: resolve-runner
    runs-on: ${{ fromJSON(needs.resolve-runner.outputs.runner) }}
    env:
      PYTHON_VERSION: "3.12"
    defaults:
      run:
        working-directory: ./packages/ai-assistant
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python ${{env.PYTHON_VERSION}}
        uses: actions/setup-python@v5
        with:
          python-version: ${{env.PYTHON_VERSION}}
          cache: 'pip'
          cache-dependency-path: packages/ai-assistant/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run checks
        run: |
          # Add any linting or testing commands here
          echo "Installation succeeded"
