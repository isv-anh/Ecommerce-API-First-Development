name: "[CD] E-Commerce API Build and Deploy"

on:
  release:
    types: [published]

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: "maven"
          cache-dependency-path: packages/openapi-generator/pom.xml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Base Controllers
        run: pnpm --filter e-commerce-api run generate:controllers

      - name: Generate Prisma Client
        run: pnpm --filter e-commerce-api exec prisma generate
        env:
          DB_USERNAME: ci
          DB_PASSWORD: ci
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/e-commerce-api
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest

      - name: Build local Docker image for scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/e-commerce-api/dockerfile
          load: true
          tags: local-api:test
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/e-commerce-api:buildcache

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'local-api:test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/e-commerce-api/dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/e-commerce-api:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/e-commerce-api:buildcache,mode=max
