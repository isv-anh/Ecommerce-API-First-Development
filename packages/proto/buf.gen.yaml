version: v2

plugins:
  # =========================
  # Python
  # =========================

  # Python AI Service
  - remote: buf.build/protocolbuffers/python
    out: ../ai-assistant/src/app/buf/generated

  # Python AI Service - gRPC Client/Server stubs 
  - remote: buf.build/grpc/python
    out: ../ai-assistant/src/app/buf/generated

  # =========================
  # TypeScript
  # =========================

  # Search Service - gRPC Server
  - remote: buf.build/community/stephenh-ts-proto
    out: ../e-commerce-search/src/buf/generated
    opt:
      - env=node
      - esModuleInterop=true
      - outputServices=grpc-js

  # BFF - gRPC Client
  - remote: buf.build/community/stephenh-ts-proto
    out: ../e-commerce-api/src/buf/generated
    opt:
      - env=node
      - esModuleInterop=true
      - outputServices=grpc-js
