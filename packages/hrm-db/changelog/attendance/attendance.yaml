databaseChangeLog:
  - changeSet:
      id: create-attendance-daily-table
      author: hoanganh
      changes:
        - createTable:
            tableName: attendance_daily
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
              - column:
                  name: uid
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: work_date
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: check_in_time
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: check_out_time
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: total_working_hours
                  type: numeric(5,2)
                  defaultValue: 0
              - column:
                  name: late_minutes
                  type: integer
                  defaultValue: 0
              - column:
                  name: status
                  type: varchar(20)
                  description: Status of attendance (present, absent, haft_day, leave)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
        - addForeignKeyConstraint:
            baseTableName: attendance_daily
            baseColumnNames: uid
            referencedTableName: users
            referencedColumnNames: uid
            onDelete: CASCADE

