databaseChangeLog:
  - changeSet:
      id: enable-pgcrypto
      author: hoanganh
      preConditions:
        - dbms:
            type: postgresql
      changes:
        - sql:
            sql: CREATE EXTENSION IF NOT EXISTS pgcrypto;

  - changeSet:
      id: create-users-table
      author: hoanganh
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: uid
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
              - column:
                  name: full_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: username
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValue: true
              - column:
                  name: is_deleted
                  type: BOOLEAN
                  defaultValue: false
              - column:
                  name: last_login
                  type: TIMESTAMP
              - column:
                  name: create_user_id
                  type: UUID
              - column:
                  name: update_user_id
                  type: UUID

  - changeSet:
      id: create-groups-table
      author: hoanganh
      changes:
        - createTable:
            tableName: groups
            columns:
              - column:
                  name: gid
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
              - column:
                  name: group_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: parent_gid
                  type: UUID
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: is_deleted
                  type: BOOLEAN
                  defaultValue: false
              - column:
                  name: create_user_id
                  type: UUID
              - column:
                  name: update_user_id
                  type: UUID

  - changeSet:
      id: create-user-groups
      author: hoanganh
      changes:
        - createTable:
            tableName: user_groups
            columns:
              - column:
                  name: uid
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: gid
                  type: UUID
                  constraints:
                    nullable: false

        - addPrimaryKey:
            columnNames: uid, gid
            tableName: user_groups

        - addForeignKeyConstraint:
            baseTableName: user_groups
            baseColumnNames: uid
            referencedTableName: users
            referencedColumnNames: uid
            constraintName: fk_user_groups_user
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: user_groups
            baseColumnNames: gid
            referencedTableName: groups
            referencedColumnNames: gid
            constraintName: fk_user_groups_group
            onDelete: CASCADE

  - changeSet:
      id: create-roles-table
      author: hoanganh
      changes:
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: role_id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true

              - column:
                  name: role_name
                  type: VARCHAR(100)
                  constraints:
                    unique: true
                    nullable: false

  - changeSet:
      id: create-permissions
      author: hoanganh
      changes:
        - createTable:
            tableName: permissions
            columns:
              - column:
                  name: pid
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true

              - column:
                  name: permission_name
                  type: VARCHAR(150)
                  constraints:
                    unique: true
                    nullable: false

  - changeSet:
      id: create-role-permission-table
      author: hoanganh
      changes:
        - createTable:
            tableName: role_permission
            columns:
              - column:
                  name: role_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: permission_id
                  type: UUID
                  constraints:
                    nullable: false
        - addPrimaryKey:
            columnNames: role_id, permission_id
            tableName: role_permission

        - addForeignKeyConstraint:
            baseTableName: role_permission
            baseColumnNames: role_id
            referencedTableName: roles
            referencedColumnNames: role_id
            constraintName: fk_role_permission_roles
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: role_permission
            baseColumnNames: permission_id
            referencedTableName: permissions
            referencedColumnNames: pid
            constraintName: fk_role_permission_permissions
            onDelete: CASCADE

  - changeSet:
      id: create-user-role-table
      author: hoanganh
      changes:
        - createTable:
            tableName: user_role
            columns:
              - column:
                  name: uid
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: role_id
                  type: UUID
                  constraints:
                    nullable: false

        - addPrimaryKey:
            columnNames: uid, role_id
            tableName: user_role

        - addForeignKeyConstraint:
            baseTableName: user_role
            baseColumnNames: uid
            referencedTableName: users
            referencedColumnNames: uid
            constraintName: fk_user_role_user
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: user_role
            baseColumnNames: role_id
            referencedTableName: roles
            referencedColumnNames: role_id
            constraintName: fk_user_role_roles
            onDelete: CASCADE

  - changeSet:
      id: create-group-role-table
      author: hoanganh
      changes:
        - createTable:
            tableName: group_role
            columns:
              - column:
                  name: gid
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: role_id
                  type: UUID
                  constraints:
                    nullable: false

        - addPrimaryKey:
            columnNames: gid, role_id
            tableName: group_role

        - addForeignKeyConstraint:
            baseTableName: group_role
            baseColumnNames: gid
            referencedTableName: groups
            referencedColumnNames: gid
            constraintName: fk_group_role_group
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: group_role
            baseColumnNames: role_id
            referencedTableName: roles
            referencedColumnNames: role_id
            constraintName: fk_group_role_roles
            onDelete: CASCADE

  - changeSet:
      id: create-positions-table
      author: hoanganh
      changes:
        - createTable:
            tableName: positions
            columns:
              - column:
                  name: position_id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true

              - column:
                  name: position_name
                  type: VARCHAR(100)
                  constraints:
                    unique: true
                    nullable: false

  - changeSet:
      id: create-user-position-table
      author: hoanganh
      changes:
        - createTable:
            tableName: user_position
            columns:
              - column:
                  name: uid
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: position_id
                  type: UUID
                  constraints:
                    nullable: false
        - addPrimaryKey:
            columnNames: uid, position_id
            tableName: user_position
        - addForeignKeyConstraint:
            baseTableName: user_position
            baseColumnNames: uid
            referencedTableName: users
            referencedColumnNames: uid
            constraintName: fk_user_position_user
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: user_position
            baseColumnNames: position_id
            referencedTableName: positions
            referencedColumnNames: position_id
            constraintName: fk_user_position_positions
            onDelete: CASCADE

  - changeSet:
      id: create-group-position-table
      author: hoanganh
      changes:
        - createTable:
            tableName: group_position
            columns:
              - column:
                  name: gid
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: position_id
                  type: UUID
                  constraints:
                    nullable: false
        - addPrimaryKey:
            columnNames: gid, position_id
            tableName: group_position
        - addForeignKeyConstraint:
            baseTableName: group_position
            baseColumnNames: gid
            referencedTableName: groups
            referencedColumnNames: gid
            constraintName: fk_group_position_group
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: group_position
            baseColumnNames: position_id
            referencedTableName: positions
            referencedColumnNames: position_id
            constraintName: fk_group_position_positions
            onDelete: CASCADE

  - changeSet:
      id: create-indexes
      author: hoanganh
      changes:
        - createIndex:
            indexName: idx_users_username
            tableName: users
            columns:
              - column:
                  name: username
