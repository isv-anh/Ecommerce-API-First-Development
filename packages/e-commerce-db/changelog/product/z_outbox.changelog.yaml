databaseChangeLog:
  - changeSet:
      id: "create-outbox-events-table"
      author: "system"
      changes:
        - createTable:
            tableName: "outbox_events"
            columns:
              - column:
                  name: "id"
                  type: "uuid"
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: "aggregate_type"
                  type: "varchar(100)"
                  constraints:
                    nullable: false
              - column:
                  name: "aggregate_id"
                  type: "varchar(255)"
                  constraints:
                    nullable: false
              - column:
                  name: "event_type"
                  type: "varchar(100)"
                  constraints:
                    nullable: false
              - column:
                  name: "payload"
                  type: "jsonb"
                  constraints:
                    nullable: false
              - column:
                  name: "status"
                  type: "varchar(50)"
                  defaultValue: "PENDING"
                  constraints:
                    nullable: false
              - column:
                  name: "created_at"
                  type: "timestamp"
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  constraints:
                    nullable: false
