                        thumbnail: https://i.pinimg.com/1200x/dc/70/2c/dc702c6762c873c76dae3f8fc3ef1eb7.jpg
                        product_code: pokemon-pikachu-tshirt-1
                        price: 4.99
                        tags:
                          - tag_name: "flash sale"
                      - product_id: 5
                        product_name: Pikachu T-Shirt
                        thumbnail: https://i.pinimg.com/1200x/dc/70/2c/dc702c6762c873c76dae3f8fc3ef1eb7.jpg
                        product_code: pokemon-pikachu-tshirt-2
                        price: 4.99
                        tags:
                          - tag_name: "flash sale"
                      - product_id: 6
                        product_name: Pikachu T-Shirt
                        thumbnail: https://i.pinimg.com/1200x/dc/70/2c/dc702c6762c873c76dae3f8fc3ef1eb7.jpg
                        product_code: pokemon-pikachu-tshirt-3
                        price: 4.99
                        tags:
                          - tag_name: "flash sale"
                      - product_id: 7
                        product_name: Pikachu T-Shirt
                        thumbnail: https://i.pinimg.com/1200x/dc/70/2c/dc702c6762c873c76dae3f8fc3ef1eb7.jpg
                        product_code: pokemon-pikachu-tshirt-4
                        price: 4.99
