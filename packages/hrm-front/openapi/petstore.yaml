          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: 500
                message: Internal server error

components:
  schemas:
    Pet:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
          example: 123
        name:
          type: string
          description: "Name of pet"
          minLength: 0
          maxLength: 40
          example: "Fluffy"
        age:
          type: integer
          format: int32
          minimum: 0
          maximum: 30
          exclusiveMinimum: true
          exclusiveMaximum: true
          example: 5
        tag:
          type: string
          pattern: '^\\d{3}-\\d{2}-\\d{4}$'
          nullable: true
          example: "123-45-6789"
        email:
          type: string
          format: email
          example: "fluffy@example.com"
        callingCode:
          type: string
          enum: ["+33", "+420", "+33"]
          example: "+420"
        country:
          type: string
          enum: ["People's Republic of China", "Uruguay"]
          example: "Uruguay"
    PetsNestedArray:
      type: object
      required:
        - pets
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Pet"
    PetsArray:
      type: array
      minItems: 1
      maxItems: 20
      items:
        $ref: "#/components/schemas/Pet"

    Product:
      type: object
      required:
        - product_id
        - product_name
        - product_code
        - price
      properties:
        product_id:
          type: integer
          format: int64
          example: 1
        product_name:
          type: string
          description: Product name
          maxLength: 255
          example: Pokemon TCG Booster Pack
        thumbnail:
          type: string
          format: uri
          example: https://i.pinimg.com/1200x/0e/3b/29/0e3b294beb09239a0625d82a2e2c0561.jpg
        product_code:
          type: string
          example: pokemon
        price:
          type: number
          format: float
          minimum: 0
          example: 4.99
        tags:
          type: array
          items:
            $ref: "#/components/schemas/ProductTag"

    ProductTag:
      type: object
      required:
        - tag_name
      properties:
        tag_name:
          type: string
          example: flash sale

    ProductsArray:
      type: object
      required:
        - products
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/Product"

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
          example: 400
        message:
          type: string
          example: "Something went wrong"
