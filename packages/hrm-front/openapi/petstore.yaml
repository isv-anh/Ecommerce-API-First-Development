openapi: "3.0.0"
info:
  version: 1.0.0
  title: Swagger Petstore
  license:
    name: MIT
servers:
  - url: http://petstore.swagger.io/v1
paths:
  /pets:
    get:
      summary: List all pets
      operationId: listPets
      tags:
        - pets
      parameters:
        - name: limit
          in: query
          description: How many items to return at one time (max 100)
          required: false
          schema:
            type: string
      responses:
        "200":
          description: A paged array of pets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetsArray"
              example:
                - id: 1
                  name: Fluffy
                  age: 5
                  tag: "123-45-6789"
                  email: "fluffy@example.com"
                  callingCode: "+420"
                  country: "Uruguay"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: 500
                message: Internal server error
    post:
      summary: Create a pet
      operationId: createPets
      tags:
        - pets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - tag
              properties:
                name:
                  type: string
                tag:
                  type: string
            example:
              name: Max
              tag: "555-66-7777"
      responses:
        "201":
          description: Null response
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: 400
                message: Bad request
  /pets-nested-array:
    get:
      summary: List all pets as nested array
      operationId: listPetsNestedArray
      tags:
        - pets
      parameters:
        - name: limit
          in: query
          description: How many items to return at one time (max 100)
          required: false
          schema:
            type: string
      responses:
        "200":
          description: A paged array of pets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetsNestedArray"
              example:
                data:
                  - id: 1
                    name: Bella
                    age: 3
                    tag: "987-65-4321"
                    email: "bella@example.com"
                    callingCode: "+33"
                    country: "People's Republic of China"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: 404
                message: Not found
  /pets/{petId}:
    get:
      summary: Info for a specific pet
      operationId: showPetById
      tags:
        - pets
      parameters:
        - name: petId
          in: path
          required: true
          description: The id of the pet to retrieve
          schema:
            type: string
        - name: testId
          in: path
          required: true
          description: The id of the pet to retrieve
          schema:
            type: string
      responses:
        "200":
          description: Expected response to a valid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
              example:
                id: 42
                name: Rex
                age: 7
                tag: "321-54-9876"
                email: "rex@example.com"
                callingCode: "+33"
                country: "Uruguay"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: 400
                message: Invalid ID supplied
  /products:
    get:
      summary: List all products
      operationId: listProducts
      tags:
        - products
      parameters:
        - name: limit
          in: query
          description: How many items to return at one time (max 100)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: A paged array of products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductsArray"
              examples:
                products:
                  summary: List of products
                  value:
                    products:
                      - product_id: 1
                        product_name: Pokemon TCG Booster Pack
                        thumbnail: https://i.pinimg.com/1200x/0e/3b/29/0e3b294beb09239a0625d82a2e2c0561.jpg
                        product_code: pokemon
                        price: 4.99
                        tags:
                          - tag_name: "flash sale"

                      - product_id: 2
