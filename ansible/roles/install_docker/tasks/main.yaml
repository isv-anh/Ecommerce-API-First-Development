---
- name: Kiểm tra Docker đã được cài đặt chưa
  command: docker --version
  register: docker_check
  changed_when: false
  failed_when: false

- name: Cài đặt Docker
  block:
    - name: Tải xuống script cài đặt Docker
      get_url:
        url: https://get.docker.com
        dest: /tmp/get-docker.sh
        mode: "0755"

    - name: Chạy script cài đặt Docker
      command: sh /tmp/get-docker.sh
      notify: restart docker
  when: docker_check.rc != 0
  rescue:
    - name: Xử lý lỗi cài đặt Docker
      fail:
        msg: "Cài đặt Docker thất bại."

- name: Xác nhận dịch vụ Docker đã được bật
  systemd:
    name: docker
    state: started
    enabled: yes

- name: Thêm người dùng hiện tại vào nhóm docker
  user:
    name: "{{ ansible_user_id }}"
    groups: docker
    append: yes
  become: true

- name: Thay đổi quyền của Docker socket
  file:
    path: /var/run/docker.sock
    mode: "0666"
  become: true

- name: Khởi động lại dịch vụ Docker
  systemd:
    name: docker
    state: restarted
  become: true

- name: Reload shell để áp dụng membership nhóm mới
  shell: newgrp docker

- name: Xác nhận Docker có thể chạy không cần sudo
  command: docker info
  register: docker_info
  ignore_errors: true
  changed_when: false

- name: Báo cáo trạng thái quyền của Docker
  debug:
    msg: "{{ 'Docker hiện có thể truy cập mà không cần sudo.' if docker_info.rc == 0 else 'Docker chưa thể truy cập mà không cần sudo. Vui lòng đăng xuất và đăng nhập lại, hoặc khởi động lại hệ thống, sau đó chạy lại playbook này để xác nhận.' }}"
  become: true
