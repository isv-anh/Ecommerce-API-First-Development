---
# Chuyển đổi môi trường thực thi bằng biến is_local
#
# Role này được gọi từ cả môi trường phát triển local (setup.yaml) và
# server dùng chung nội bộ (setup-shared-server.yaml).
# Các task dưới đây chỉ cần thực thi trong môi trường phát triển local,
# vì vậy được kiểm soát bằng biến is_local.
#
#   - Tạo file biến môi trường (env-*.yaml):
#     Trên server dùng chung, file biến môi trường sẽ bị xóa bởi Cleanup của
#     GitHub Actions, nên thay vì dùng Ansible, file biến môi trường được đặt
#     sẵn trong server và sao chép vào trong workflow khi cần.
#
# Cách chỉ định từ phía gọi:
#   - Môi trường phát triển local: không chỉ định is_local (sẽ chạy nhờ default(true))
#   - Server dùng chung:           truyền is_local: false qua vars
- name: Đặt múi giờ
  timezone:
    name: Asia/Ho_Chi_Minh
  become: true
# Đăng ký cron job để chạy định kỳ setup (chỉ dành cho môi trường phát triển local)
# Vì update.sh thực thi setup.yml nên không chạy trên server dùng chung
- name: Sao chép cron job
  copy:
    src: "{{ playbook_dir }}/ansible/update.sh"
    dest: /etc/cron.weekly/e-commerce_dev_env_update
    mode: "0755"
  become: true
  when: is_local | default(true)
- import_tasks: install.yaml
- import_tasks: env-e-commerce-api.yaml
  when: is_local | default(true)
- import_tasks: env-e-commerce-front.yaml
  when: is_local | default(true)
